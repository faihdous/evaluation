<style>
  :root{
    /* فاتح/رسمي */
    --panel: rgba(255,255,255,0.72);
    --text: #0b1b2a;                 /* كتابة داكنة */
    --muted: rgba(11,27,42,0.65);
    --border: rgba(11,27,42,0.14);

    /* ألوان هوية */
    --primaryBlue: #0b3d91;         /* أزرق رسمي */
    --secondaryGreen: #0e7a4b;     /* أخضر رسمي */
    --yellow: #ffd24a;

    --shadow: 0 18px 45px rgba(2,6,23,0.16);
    --radius2: 22px;

    --gap: 14px;
    --fieldPad: 12px;
    --radius: 14px;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    font-family: "Tajawal","Cairo","Segoe UI",Tahoma,Arial,sans-serif;
    color: var(--text);

    /* خلفية أفتح وتناسب الرسمية */
    background:
      radial-gradient(900px 500px at 10% 0%, rgba(11,61,145,0.20), transparent 60%),
      radial-gradient(900px 500px at 90% 0%, rgba(14,122,75,0.18), transparent 60%),
      linear-gradient(180deg, #f3f6ff, #eef3ff);
    min-height: 100vh;
  }

  header{
    display:flex;
    gap: 12px;
    align-items:center;
    justify-content: space-between;
    padding: 12px 14px;
    background: rgba(255,255,255,0.70);
    border: 1px solid var(--border);
    border-radius: var(--radius2);
    box-shadow: var(--shadow);
    backdrop-filter: blur(10px);
  }

  .card{
    background: rgba(255,255,255,0.74);
    border: 1px solid var(--border);
    border-radius: var(--radius2);
    box-shadow: var(--shadow);
    backdrop-filter: blur(12px);
    overflow:hidden;
  }

  .card .cardHead{
    padding: 12px 14px;
    border-bottom: 1px solid rgba(11,27,42,0.10);
    /* تدرّج رسمي قريب للأزرق/الأخضر */
    background: linear-gradient(90deg, rgba(14,122,75,0.14), rgba(11,61,145,0.12));
  }

  /* عشان باقي الستايل عندك يعتمد على --text و --muted */
  label{ color: var(--muted); }

  input, select, textarea{
    background: rgba(255,255,255,0.85);
    border: 1px solid rgba(11,27,42,0.18);
    color: var(--text);
  }

  option{ background:#f8fbff; color:#0b1b2a; }

  input::placeholder, textarea::placeholder{ color: rgba(11,27,42,0.45); }

  .fineprint{
    color: rgba(11,27,42,0.58);
  }

  .msg{
    background: rgba(255,255,255,0.70);
    border: 1px solid rgba(11,27,42,0.14);
    color: rgba(11,27,42,0.72);
  }

  .btn.alt{
    background: rgba(11,27,42,0.06);
    color: var(--text);
    border: 1px solid rgba(11,27,42,0.16);
  }

  /* زر الأخضر يبقى رسمي */
  .btn.green{
    background: rgba(14,122,75,1);
    color: #fff;
    box-shadow: 0 10px 20px rgba(14,122,75,0.22);
  }
</style>
