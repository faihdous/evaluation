<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>تقييم موظفين - الشامية</title>
  <style>
    :root{
      --text: #0b1b2a;
      --muted: rgba(11,27,42,0.65);
      --border: rgba(11,27,42,0.14);

      --secondaryGreen: #0e7a4b;
      --yellow: #ffd24a;

      --shadow: 0 18px 45px rgba(2,6,23,0.16);
      --radius2: 22px;

      --gap: 14px;
      --fieldPad: 12px;
      --radius: 14px;
    }

    *{ box-sizing: border-box; }
    body{
      margin:0;
      font-family: "Tajawal","Cairo","Segoe UI",Tahoma,Arial,sans-serif;
      color: var(--text);

      background:
        radial-gradient(900px 500px at 10% 0%, rgba(11,61,145,0.20), transparent 60%),
        radial-gradient(900px 500px at 90% 0%, rgba(14,122,75,0.18), transparent 60%),
        linear-gradient(180deg, #f3f6ff, #eef3ff);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container{ width: min(1200px, 96vw); margin: 12px auto 22px; }

    /* ===== header fix (مناسب للجوال) ===== */
    header{
      display:flex;
      gap: 12px;
      align-items:center;
      justify-content: center !important; /* ✅ متمركز */
      padding: 12px 14px;
      background: rgba(255,255,255,0.72);
      border: 1px solid var(--border);
      border-radius: var(--radius2);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);

      position: relative;
      text-align: center;
    }

    header .brand{
      width: 100%;
      display:flex;
      align-items:center;
      justify-content:center;
      position: relative;
      padding-left: 72px;   /* مساحة للشعار يمين/يسار حسب RTL */
      padding-right: 72px;  /* احتياط للجوال */
      min-width: 0;
    }

    .logo{
      width: 56px; height: 56px;
      border-radius: 50%;
      border: 2px solid rgba(11,61,145,0.25);
      background: rgba(11,61,145,0.08);
      object-fit: cover;
      flex: 0 0 auto;

      position: absolute;
      right: 14px;   /* ✅ الشعار يمين */
      top: 50%;
      transform: translateY(-50%);
    }

    .brand h1{
      margin:0;
      font-size:16px;
      line-height:1.35;
      letter-spacing:0.2px;
      text-align:center;
      width: 100%;
      padding: 0 10px;
    }
    .brand p{
      margin:6px 0 0;
      color: var(--muted);
      font-size:12px;
      text-align:center;
      width: 100%;
      padding: 0 10px;
    }

    /* ===== لو الشاشة صغيرة جدًا نخلي العنوان يظل واضح ===== */
    @media(max-width: 520px){
      header{ padding: 12px 12px; }
      header .brand{
        padding-left: 66px;
        padding-right: 66px;
      }
      .logo{
        width: 52px; height: 52px;
        right: 10px;
      }
      .brand h1{ font-size: 15px; }
      .brand p{ font-size: 12px; }
    }

    .card{
      background: rgba(255,255,255,0.80);
      border: 1px solid var(--border);
      border-radius: var(--radius2);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      overflow:hidden;
    }
    .card .cardHead{
      padding: 12px 14px;
      border-bottom: 1px solid rgba(11,27,42,0.10);
      background: linear-gradient(90deg, rgba(14,122,75,0.14), rgba(11,61,145,0.12));
    }
    .card h2{ margin:0; font-size:15px; letter-spacing:0.2px; text-align:center; }

    .grid{
      display:grid;
      grid-template-columns: 1fr;
      gap: var(--gap);
      margin-top: 14px;
    }

    .cardBody{ padding: 14px; }

    /* ✅ تمركز من داخل الكرت */
    .form-center-wrap{
      width: 100%;
      max-width: 680px; /* ✅ يضبط عرض النموذج على الجوال/الشاشة الصغيرة */
      margin: 0 auto;
      display:flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .row{
      display:grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 14px;
      width: 100%;
    }
    @media(min-width: 720px){
      .row.two{ grid-template-columns: 1fr 1fr; }
    }

    label{
      display:block;
      color: var(--muted);
      font-weight: 800;
      margin-bottom: 8px;
      font-size: 13px;
      text-align: center;
      width: 100%;
    }

    /* ✅ الحقول تكون وسط */
    input, select, textarea{
      width:100%;
      padding: calc(var(--fieldPad) + 2px) 12px;
      border-radius: var(--radius);
      border: 1px solid rgba(11,27,42,0.18);
      background: rgba(255,255,255,0.9);
      color: var(--text);
      outline:none;
      appearance: none;
      -webkit-appearance: none;
      font-size: 15px;

      display:block;
      margin-left:auto;
      margin-right:auto;
      text-align: right; /* كتابة داخل الحقل RTL */
    }

    select{
      padding-left: 40px;
      background-image:
        linear-gradient(45deg, transparent 50%, rgba(11,61,145,0.85) 50%),
        linear-gradient(135deg, rgba(11,61,145,0.85) 50%, transparent 50%),
        linear-gradient(to right, rgba(11,27,42,0.16), rgba(11,27,42,0.16));
      background-position:
        calc(10px) 50%,
        calc(18px) 50%,
        calc(100% - 42px) 50%;
      background-size:
        8px 8px,
        8px 8px,
        1px 22px;
      background-repeat: no-repeat;
    }

    option{ background:#f8fbff; color:#0b1b2a; }
    input::placeholder, textarea::placeholder{ color: rgba(11,27,42,0.45); }
    textarea{ min-height: 86px; resize: vertical; }

    .btnRow{
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items:center;
      justify-content: center;
      width: 100%;
      margin-top: 14px;
    }

    .btn{
      border:none;
      cursor:pointer;
      padding: 12px 14px;
      border-radius: 16px;
      font-weight: 950;
      color: #071018;

      background: var(--yellow);
      transition: 0.2s;
      box-shadow: 0 10px 20px rgba(255,210,74,0.18);
      user-select:none;
      white-space: nowrap;
      min-height: 46px;
      width: auto;
    }
    .btn:hover{ transform: translateY(-1px); }

    @media(max-width: 480px){
      .btnRow .btn{ width: 100%; }
      .btnRow{ gap: 12px; }
    }

    .btn.alt{
      background: rgba(11,27,42,0.06);
      color: var(--text);
      border: 1px solid rgba(11,27,42,0.16);
      box-shadow: none;
    }
    .btn.alt:hover{ background: rgba(11,27,42,0.10); }

    .btn.green{
      background: rgba(14,122,75,1);
      color: #fff;
      box-shadow: 0 10px 20px rgba(14,122,75,0.22);
    }

    .msg{
      margin-top: 12px;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid rgba(11,27,42,0.14);
      background: rgba(255,255,255,0.78);
      color: rgba(11,27,42,0.72);
      line-height: 1.7;
      font-weight: 850;
      font-size: 13px;
      display:none;
      text-align:center;
      width: 100%;
    }

    .fineprint{
      color: rgba(11,27,42,0.58);
      font-size: 12px;
      margin-top: 10px;
      line-height: 1.7;
      text-align: center;
      width: 100%;
    }

    /* مساحة أسفل الأسئلة */
    #questionsContainer{
      display:flex;
      flex-direction:column;
      gap:14px;
      margin-top:10px;
      width:100%;
      align-items:center;
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <div class="brand">
        <img class="logo" alt="Logo" src="logo.png" />
        <div>
          <h1>إدارة الهوية الوطنية - مركز الشامية</h1>
          <p>تقييم الموظف</p>
        </div>
      </div>
    </header>

    <div class="grid">
      <section class="card">
        <div class="cardHead">
          <h2>رأيك يصنع الفرق</h2>
          <h2>قيم تجربتك اليوم</h2>
        </div>

        <div class="cardBody">
          <div class="form-center-wrap">
            <div class="row two">
              <div>
                <label>اسم الموظف</label>
                <select id="employeeSelect"></select>
              </div>
              <div></div>
            </div>

            <div class="row two">
              <div>
                <label>اسم المراجع</label>
                <input id="reviewerName" placeholder="اكتب اسمك" inputmode="text" />
              </div>
              <div>
                <label>رقم الهاتف</label>
                <input id="reviewerPhone" placeholder="مثال: 5XXXXXXXX" inputmode="tel" />
              </div>
            </div>

            <div style="width:100%; margin-top:8px;">
              <div class="fineprint" style="margin-top:0;"></div>
              <div id="questionsContainer"></div>
            </div>

            <div class="row" style="margin-top:14px;">
              <div>
                <label>ملاحظة (اختياري)</label>
                <input id="commentShort" placeholder="اكتب ملاحظة سريعة" inputmode="text" />
              </div>
            </div>

            <div class="btnRow">
              <button class="btn green" id="submitReviewBtn" type="button">إرسال التقييم</button>
              <button class="btn alt" id="clearBtn" type="button">مسح</button>
            </div>

            <div class="msg" id="toastMsg"></div>
            <div class="fineprint"></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script>
    const center = "مركز الشامية";

    const LS_KEYS = {
      current: "reviews_current_v3",
      employeesByCenter: "employees_by_center_v1",
      questions: "rating_questions_v1"
    };

    function loadJson(key, fallback){
      try{
        const v = localStorage.getItem(key);
        return v ? JSON.parse(v) : fallback;
      }catch(e){
        return fallback;
      }
    }

    function saveJson(key, value){
      localStorage.setItem(key, JSON.stringify(value));
    }

    function escapeHtml(str){
      return String(str ?? "")
        .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
        .replaceAll('"',"&quot;").replaceAll("'","&#039;");
    }

    function formatDateTime(iso){
      const d = new Date(iso);
      return d.toLocaleString("ar-KW", {
        year:"numeric", month:"2-digit", day:"2-digit",
        hour:"2-digit", minute:"2-digit"
      });
    }

    function showToast(html){
      const toastMsg = document.getElementById("toastMsg");
      toastMsg.style.display = "block";
      toastMsg.innerHTML = html;
      setTimeout(()=>{ toastMsg.style.display = "none"; }, 4500);
    }

    function getRatingOptions(){
      return ["ممتاز","جيد","مقبول"];
    }

    // -------- Elements --------
    const employeeSelect = document.getElementById("employeeSelect");
    const reviewerName = document.getElementById("reviewerName");
    const reviewerPhone = document.getElementById("reviewerPhone");
    const commentShort = document.getElementById("commentShort");

    const submitReviewBtn = document.getElementById("submitReviewBtn");
    const clearBtn = document.getElementById("clearBtn");
    const toastMsg = document.getElementById("toastMsg");

    const questionsContainer = document.getElementById("questionsContainer");

    // -------- Employees render --------
    function renderEmployeesForCenter(){
      const employeesByCenter = loadJson(LS_KEYS.employeesByCenter, {});
      const list = employeesByCenter[center] || [];

      employeeSelect.innerHTML = "";

      const unique = Array.from(new Set(list.map(x => String(x).trim()).filter(Boolean)));

      if(unique.length === 0){
        const opt = document.createElement("option");
        opt.value = "";
        opt.textContent = "لا يوجد موظفون لهذا المركز (أضف من الإدارة)";
        employeeSelect.appendChild(opt);
        return;
      }

      for(const name of unique){
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        employeeSelect.appendChild(opt);
      }
    }

    // -------- Questions render (Dynamic) --------
    function loadQuestions(){
      return loadJson(LS_KEYS.questions, []); // [{id,text}]
    }

    function renderQuestionDropdowns(){
      const qs = loadQuestions();
      questionsContainer.innerHTML = "";

      if(!qs.length){
        const info = document.createElement("div");
        info.className = "fineprint";
        info.style.marginTop = "0";
        info.textContent = "لا توجد أسئلة مضافة حالياً.";
        questionsContainer.appendChild(info);
        return;
      }

      qs.forEach((q)=>{
        const optionsHtml = getRatingOptions()
          .map(opt => `<option value="${opt}">${opt}</option>`)
          .join("");

        const wrap = document.createElement("div");
        wrap.style.width = "100%";
        wrap.style.display = "block";
        wrap.innerHTML = `
          <div class="row" style="margin-bottom:0;">
            <div>
              <label>${escapeHtml(q.text)}</label>
              <select data-qid="${escapeHtml(q.id)}">
                ${optionsHtml}
              </select>
            </div>
          </div>
        `;
        questionsContainer.appendChild(wrap);
      });
    }

    // -------- Submit --------
    submitReviewBtn.addEventListener("click", () => {
      const employeeName = employeeSelect.value;

      const name = (reviewerName.value || "").trim();
      const phone = (reviewerPhone.value || "").trim();
      const comment = (commentShort.value || "").trim();

      if(!employeeName) return showToast("❌ اختر <b>اسم الموظف</b>.");
      if(!name) return showToast("❌ الرجاء إدخال <b>اسم المراجع</b>.");
      if(!phone) return showToast("❌ الرجاء إدخال <b>رقم الهاتف</b>.");

      const qs = loadQuestions();
      const questionAnswers = {};

      for(const q of qs){
        const sel = document.querySelector(`select[data-qid="${q.id}"]`);
        if(sel) questionAnswers[q.id] = sel.value;
      }

      const rating = qs.length
        ? (questionAnswers[qs[0].id] || "مقبول")
        : "مقبول";

      const currentReviews = loadJson(LS_KEYS.current, []);

      const review = {
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
        createdAt: new Date().toISOString(),
        center: center,
        employeeName,
        reviewerName: name,
        reviewerId: "",
        reviewerPhone: phone,
        rating,
        comment,
        questionAnswers
      };

      currentReviews.unshift(review);
      saveJson(LS_KEYS.current, currentReviews);

      reviewerName.value = "";
      reviewerPhone.value = "";
      commentShort.value = "";

      renderQuestionDropdowns();
      showToast(`✅ تم إرسال التقييم بنجاح عند <b>${formatDateTime(review.createdAt)}</b>.`);
    });

    // -------- Clear --------
    clearBtn.addEventListener("click", () => {
      reviewerName.value = "";
      reviewerPhone.value = "";
      commentShort.value = "";
      toastMsg.style.display = "none";
      renderQuestionDropdowns();
    });

    // init
    renderEmployeesForCenter();
    renderQuestionDropdowns();
  </script>
</body>
</html>
