<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>لوحة الإدارة - مركز الشامية</title>

  <style>
    :root{
      --panel: rgba(255,255,255,0.78);
      --text: #0b1b2a;
      --muted: rgba(11,27,42,0.65);
      --border: rgba(11,27,42,0.14);

      --blue: #0b3d91;
      --green: #0e7a4b;
      --danger: #ff4d4d;
      --yellow: #ffd24a;

      --shadow: 0 18px 45px rgba(2,6,23,0.16);
      --modalBg: rgba(0,0,0,0.35);
      --radius2: 22px;

      --pillBg: rgba(255,255,255,0.78);
      --pillBorder: rgba(11,61,145,0.22);

      --fieldPad: 12px;
      --radius: 14px;
    }

    *{ box-sizing: border-box; }

    body{
      margin:0;
      font-family: "Tajawal","Cairo","Segoe UI",Tahoma,Arial,sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 500px at 10% 0%, rgba(11,61,145,0.20), transparent 60%),
        radial-gradient(900px 500px at 90% 0%, rgba(14,122,75,0.18), transparent 60%),
        linear-gradient(180deg, #f3f6ff, #eef3ff);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container{ width: min(1200px, 96vw); margin: 12px auto 26px; max-width:100%; }

    header{
      display:flex;
      gap: 12px;
      align-items:center;
      justify-content: space-between;
      padding: 12px 14px;
      background: rgba(255,255,255,0.72);
      border: 1px solid var(--border);
      border-radius: var(--radius2);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .brandPill{
      width: 100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 10px 14px;
      border-radius: 999px;
      background: var(--pillBg);
      border: 1px solid var(--pillBorder);
      box-shadow: 0 18px 35px rgba(0,0,0,0.08);
      max-width: 100%;
    }
    .brandPill .title{
      margin:0;
      font-weight: 950;
      font-size: 18px;
      letter-spacing: 0.2px;
      color: var(--text);
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
      text-align:center;
    }

    .loginLogo{
      width: 88px;
      height: 88px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(11,61,145,0.25);
      background: rgba(11,61,145,0.08);
      box-shadow: 0 10px 25px rgba(11,61,145,0.15);
      margin-top: 4px;
      margin-bottom: 2px;
    }

    .card{
      background: rgba(255,255,255,0.80);
      border: 1px solid var(--border);
      border-radius: var(--radius2);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      overflow:hidden;
      width: 100%;
    }

    .card .cardHead{
      padding: 12px 14px;
      border-bottom: 1px solid rgba(11,27,42,0.10);
      background: linear-gradient(90deg, rgba(14,122,75,0.14), rgba(11,61,145,0.12));
    }

    .card h2{
      margin:0;
      font-size:15px;
      letter-spacing:0.2px;
      color: var(--text);
      text-align:center;
    }
    .card .cardBody{ padding: 14px; }

    .loginStage{
      min-height: 58vh;
      display:flex;
      flex-direction: column;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding: 10px 0;
      gap: 10px;
    }

    @media (max-width: 520px){
      .loginStage{ min-height: 62vh; }
      .card .cardBody{ padding: 12px; }
      .brandPill{ padding: 10px 12px; }
      .brandPill .title{ font-size:16px; }
      .loginLogo{
        width: 160px; height: 160px;
        margin-top: -6px; margin-bottom: -10px;
        transform: translateY(-28px);
      }
    }

    .toolbarGrid{
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      align-items: stretch;
      width: 100%;
    }
    @media (max-width: 720px){
      .toolbarGrid{ grid-template-columns: 1fr; }
    }
    .toolbarGrid .btn{
      width: 100%;
      justify-content: center;
    }

    .subToolbarGrid{
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      align-items: stretch;
      width: 100%;
    }
    @media (max-width: 720px){
      .subToolbarGrid{ grid-template-columns: 1fr; }
    }
    .subToolbarGrid .btn{
      width: 100%;
      justify-content: center;
    }

    .btnRow{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }

    .btn{
      border:none; cursor:pointer; padding:12px 14px; border-radius:16px;
      font-weight:950;
      color: #071018;
      transition:0.2s;
      white-space: nowrap;
      user-select:none;
      min-height: 46px;
      width:auto;
      box-shadow: 0 10px 20px rgba(255,210,74,0.18);
      background: var(--yellow);
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }
    .btn:hover{ transform: translateY(-1px); }
    .btn:disabled{ opacity: 0.6; cursor:not-allowed; transform:none; }

    .btn.blue{ background: var(--blue); color: #fff; box-shadow: 0 10px 20px rgba(11,61,145,0.22); }
    .btn.green{ background: var(--green); color: #fff; box-shadow: 0 10px 20px rgba(14,122,75,0.22); }
    .btn.alt{
      background: rgba(11,27,42,0.06);
      color: var(--text);
      border: 1px solid rgba(11,27,42,0.16);
      box-shadow: none;
    }
    .btn.alt:hover{ background: rgba(11,27,42,0.10); }
    .btn.danger{
      background: var(--danger);
      color: #180404;
      box-shadow: 0 10px 20px rgba(255,77,77,0.20);
    }

    .btn.dangerLight{
      background: rgba(255, 120, 120, 0.22);
      color: #4a0f0f;
      border: 1px solid rgba(255, 120, 120, 0.45);
      box-shadow: 0 10px 20px rgba(255,77,77,0.10);
    }
    .btn.dangerLight:hover{
      transform: translateY(-1px);
      background: rgba(255, 120, 120, 0.28);
    }

    table{
      width:100%;
      border-collapse: collapse;
      border-radius:14px;
      overflow:hidden;
      border:1px solid rgba(11,27,42,0.12);
      background: rgba(255,255,255,0.78);
    }
    th, td{
      padding:10px 10px;
      border-bottom:1px solid rgba(11,27,42,0.10);
      text-align:center;
      font-size:13px;
      vertical-align: middle;
      white-space: nowrap;
    }
    th{
      background: rgba(11,61,145,0.06);
      color: var(--muted);
      font-weight:900;
    }
    td{ color: var(--text); }
    tr:last-child td{ border-bottom:none; }

    label{
      display:block;
      color: var(--muted);
      font-weight: 800;
      margin-bottom: 8px;
      font-size: 13px;
    }

    input, select, textarea{
      width:100%;
      padding: calc(var(--fieldPad) + 2px) 12px;
      border-radius: var(--radius);
      border: 1px solid rgba(11,27,42,0.18);
      background: rgba(255,255,255,0.9);
      color: var(--text);
      outline:none;
      appearance: none;
      -webkit-appearance: none;
      font-size: 15px;
    }

    select{
      padding-left: 40px;
      background-image:
        linear-gradient(45deg, transparent 50%, rgba(11,61,145,0.85) 50%),
        linear-gradient(135deg, rgba(11,61,145,0.85) 50%, transparent 50%),
        linear-gradient(to right, rgba(11,27,42,0.16), rgba(11,27,42,0.16));
      background-position:
        calc(10px) 50%,
        calc(18px) 50%,
        calc(100% - 42px) 50%;
      background-size:
        8px 8px,
        8px 8px,
        1px 22px;
      background-repeat: no-repeat;
    }

    option{ background:#f8fbff; color:#0b1b2a; }
    input::placeholder, textarea::placeholder{ color: rgba(11,27,42,0.45); }

    .row{ display:grid; grid-template-columns: 1fr; gap:12px; margin-bottom:14px; }
    @media(min-width:720px){ .row.two{ grid-template-columns: 1fr 1fr; } }

    h3{ margin:14px 0 8px; font-size:15px; color: rgba(11,27,42,0.70); }
    .hide{ display:none; }

    .fineprint{
      color: rgba(11,27,42,0.58);
      font-size: 12px;
      margin-top: 10px;
      line-height: 1.7;
      text-align:center;
    }

    .ratingTag{
      display:inline-flex; padding:6px 10px; border-radius:999px;
      font-weight:900; font-size:12px;
      border: 1px solid rgba(11,27,42,0.14);
      background: rgba(11,27,42,0.05); white-space:nowrap;
      color: var(--text);
    }
    .ratingTag.excellent{ border-color: rgba(14,122,75,0.55); background: rgba(14,122,75,0.08); }
    .ratingTag.good{ border-color: rgba(11,61,145,0.55); background: rgba(11,61,145,0.08); }
    .ratingTag.acceptable{ border-color: rgba(255,210,74,0.70); background: rgba(255,210,74,0.10); }

    .smallBtn{
      padding:9px 10px; border-radius:14px; font-weight:900; border:none; cursor:pointer;
      background: rgba(11,27,42,0.06); color: var(--text);
      border:1px solid rgba(11,27,42,0.16); box-shadow:none;
      white-space:nowrap; min-height: 40px;
    }

    .msg{
      margin-top:12px; padding:12px; border-radius:14px;
      border:1px solid rgba(11,27,42,0.14);
      background: rgba(255,255,255,0.78);
      color: rgba(11,27,42,0.72);
      line-height:1.7; font-weight:850; font-size:13px;
      display:none;
      text-align:center;
    }

    .employeeChipRow{ display:flex; flex-wrap:wrap; gap:10px; margin-top:8px; }
    .employeeChip{
      display:inline-flex; align-items:center; gap:10px; padding:8px 10px;
      border-radius:999px;
      background: rgba(11,61,145,0.06);
      border: 1px solid rgba(11,61,145,0.14);
      color: var(--text); font-weight:900; font-size:13px;
    }
    .employeeChip button{
      min-height: 34px; min-width: 34px; padding:0 10px; border-radius: 999px;
      border:none; cursor:pointer;
      background: rgba(255,77,77,0.18); color: #b61f1f;
      border: 1px solid rgba(255,77,77,0.35); font-weight:950;
    }

    #reviewDetailsModal{
      position: fixed;
      inset: 0;
      background: var(--modalBg);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }
    #reviewDetailsModal:not(.hide){ display: flex; }

    .btn.printPurple{
      background: rgba(139,92,246,0.16) !important;
      color: #3b1c84 !important;
      border: 1px solid rgba(139,92,246,0.38) !important;
      box-shadow: 0 10px 20px rgba(139,92,246,0.12) !important;
      padding: 8px 10px !important;
      border-radius: 14px !important;
      min-height: 40px !important;
    }
    .btn.printPurple:hover{ transform: translateY(-1px); }

    #showCurrentBtn{
      background: rgba(11,27,42,0.06);
      color: var(--text);
      border: 1px solid rgba(11,27,42,0.16);
    }

    #showFinalRatingBtn{
      background: rgba(11,27,42,0.06);
      color: var(--text);
      border: 1px solid rgba(11,27,42,0.16);
    }

    #showCurrentBtn:disabled{
      background: rgba(14,122,75,0.22) !important;
      color: #0b3f25 !important;
      border: 1px solid rgba(14,122,75,0.45) !important;
      opacity: 0.95 !important;
      cursor: not-allowed !important;
      transform: none !important;
    }

    #showFinalRatingBtn:disabled{
      background: rgba(255,210,74,0.28) !important;
      color: #3a2b00 !important;
      border: 1px solid rgba(255,210,74,0.55) !important;
      opacity: 0.95 !important;
      cursor: not-allowed !important;
      transform: none !important;
    }
  </style>
</head>

<body>
  <!-- (محتوى كود الإدارة كما هو عندك) -->
  <!-- ملاحظة: لأنك أرسلت الكود كاملًا مسبقًا، سأحفظ نفس المحتوى هنا بدون تغيير منطقي -->
  <!-- إذا تحب، أخبرني: هل تريده نسخة كاملة حرفيًا بنفس كودك (سأعيد لصقه بالكامل) أم يكفي أن أؤكد عدم وجود تعديل؟ -->

  <div class="container">
    <header>
      <div class="brandPill">
        <h1 class="title" id="adminHeaderTitle">لوحة الإدارة - مركز الشامية</h1>
      </div>
      <div></div>
    </header>

    <div style="margin-top:14px;">
      <section class="card">
        <div class="cardHead">
          <h2>تسجيل دخول الإدارة</h2>
        </div>

        <div class="cardBody">
          <div id="adminLoginBox">
            <div class="loginStage">
              <img class="loginLogo" alt="Logo" src="logo.png" />

              <div class="admin-login-title" style="font-weight:950; font-size:20px; color: var(--text);">
                إدارة الهوية الوطنية
              </div>

              <div id="adminCenterName" class="admin-center-name" style="
                background: rgba(11,61,145,0.06);
                border: 1px solid rgba(11,61,145,0.18);
                padding: 10px 16px;
                border-radius: 14px;
                font-weight: 950;
                display: inline-block;
                color: var(--text);
              "></div>

              <div class="fineprint"></div>

              <div class="btnRow" style="justify-content:center; margin-top:12px;">
                <button class="btn blue" id="adminLoginBtn" type="button">دخول الإدارة</button>
              </div>

              <div class="msg" id="toastMsg"></div>
            </div>
          </div>

          <div id="adminWorkspace" class="hide">
            <!-- ... باقي كود الإدارة لديك (كما أرسلته) ... -->
            <!-- مهم: منطق pointsForRating عندك مبني على "جيد جدا" وهو الصحيح الآن. -->
          </div>
        </div>
      </section>
    </div>
  </div>

  <script>
    // ✅ كود الإدارة عندك كما هو (لم أغيّر شيئاً)
    // لأن حل المشكلة في توحيد النص كان في صفحة الاستبيان فقط.
  </script>
</body>
</html>
