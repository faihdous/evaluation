<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>لوحة استبيان - مجمع الخيران</title>

  <style>
    /* =========================
       Neon Glass Theme (مطابقة الشامية من ناحية الستايل/المنطق)
       ========================= */
    :root{
      --bg1: #0b1026;
      --bg2: #06162c;

      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.66);

      --panel: rgba(255,255,255,0.10);
      --panel2: rgba(255,255,255,0.08);
      --border: rgba(255,255,255,0.16);

      --blue: #4da3ff;
      --green: #21d19f;
      --danger: #ff5a7a;
      --yellow: #ffd166;

      --shadow: 0 22px 70px rgba(0,0,0,0.45);

      --modalBg: rgba(0,0,0,0.55);
      --radius2: 22px;
      --radius: 14px;
      --fieldPad: 12px;

      --pillBg: rgba(255,255,255,0.14);
      --pillBorder: rgba(77,163,255,0.28);

      --g1: radial-gradient(900px 500px at 10% 0%, rgba(77,163,255,0.28), transparent 58%);
      --g2: radial-gradient(900px 520px at 90% 0%, rgba(33,209,159,0.26), transparent 60%);
      --g3: radial-gradient(680px 420px at 50% 10%, rgba(255,209,102,0.16), transparent 60%);
      --g4: linear-gradient(180deg, #0d1435, #070f22);
    }

    *{ box-sizing: border-box; }

    body{
      margin:0;
      font-family: "Tajawal","Cairo","Segoe UI",Tahoma,Arial,sans-serif;
      color: var(--text);
      background: var(--g1), var(--g2), var(--g3), var(--g4);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    body::before{
      content:"";
      position: fixed;
      inset: -40px;
      pointer-events: none;
      background:
        radial-gradient(800px 420px at 20% 15%, rgba(77,163,255,0.26), transparent 58%),
        radial-gradient(700px 380px at 80% 20%, rgba(33,209,159,0.22), transparent 60%),
        radial-gradient(620px 340px at 50% 0%, rgba(255,209,102,0.12), transparent 62%);
      filter: blur(18px) brightness(1.12) saturate(1.05);
      opacity: 0.68;
      animation: glowFloat 10s ease-in-out infinite;
      z-index: -1;
    }
    @keyframes glowFloat{
      0%,100%{ transform: translate3d(0,0,0); }
      50%{ transform: translate3d(0,-10px,0); }
    }

    body::after{
      content:"";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      background: rgba(0,0,0,0.06);
    }

    .container{ width: min(1200px, 96vw); margin: 12px auto 26px; max-width:100%; }

    header{
      display:flex;
      gap: 12px;
      align-items:center;
      justify-content: space-between;
      padding: 12px 14px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: var(--radius2);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      position: sticky;
      top: 10px;
      z-index: 50;
    }

    .brandPill{
      width: 100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(77,163,255,0.28);
      box-shadow:
        0 0 0 1px rgba(77,163,255,0.10) inset,
        0 18px 55px rgba(77,163,255,0.12);
      max-width: 100%;
      position: relative;
      overflow: hidden;
    }

    .brandPill::after{
      content:"";
      position:absolute;
      inset:-2px;
      background: linear-gradient(90deg, rgba(77,163,255,0.0), rgba(77,163,255,0.30), rgba(33,209,159,0.0));
      transform: translateX(-60%);
      animation: shimmer 2.8s ease-in-out infinite;
      opacity: 0.62;
    }
    @keyframes shimmer{
      0%, 100%{ transform: translateX(-60%); }
      50%{ transform: translateX(60%); }
    }

    header .brandTitle{
      margin:0;
      font-weight: 950;
      font-size: 18px;
      letter-spacing: 0.2px;
      color: rgba(255,255,255,0.97);
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
      text-align:center;
      position: relative;
      z-index: 2;
    }

    header .brandSub{
      margin-top: 4px;
      color: rgba(255,255,255,0.78);
      font-weight: 850;
      font-size: 12.5px;
      position: relative;
      z-index: 2;
      text-align:center;
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .card{
      background: rgba(255,255,255,0.13);
      border: 1px solid rgba(255,255,255,0.20);
      border-radius: var(--radius2);
      box-shadow: 0 18px 60px rgba(0,0,0,0.35);
      backdrop-filter: blur(14px);
      overflow:hidden;
      width: 100%;
      transform: translateZ(0);
    }

    .card .cardHead{
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.16);
      background: linear-gradient(90deg, rgba(33,209,159,0.22), rgba(77,163,255,0.20));
      position: relative;
    }

    .card .cardHead::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(500px 130px at 10% 50%, rgba(77,163,255,0.30), transparent 60%),
        radial-gradient(500px 130px at 90% 50%, rgba(33,209,159,0.26), transparent 60%);
      opacity: 0.70;
      pointer-events:none;
    }

    .card h2{
      margin:0;
      font-size:15px;
      letter-spacing:0.2px;
      color: rgba(255,255,255,0.98);
      text-align:center;
      position: relative;
      z-index: 2;
      font-weight: 950;
    }

    .card .cardBody{ padding: 14px; }

    .form-center-wrap{
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      display:flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .grid{
      display:grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-top: 14px;
    }

    .row{
      display:grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 14px;
      width: 100%;
    }
    @media(min-width:720px){
      .row.two{ grid-template-columns: 1fr 1fr; }
    }

    label{
      display:block;
      color: rgba(255,255,255,0.72);
      font-weight: 800;
      margin-bottom: 8px;
      font-size: 13px;
      text-align:center;
      width: 100%;
    }

    input, select, textarea{
      width:100%;
      padding: calc(var(--fieldPad) + 2px) 12px;
      border-radius: var(--radius);
      border: 1px solid rgba(255,255,255,0.
